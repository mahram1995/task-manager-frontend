<div class="page">
    <div class="toolbar">
        <h2>Task Notes</h2><button pButton label="Task details" severity="secondary" (click)="back()"></button>
    </div>
    <div class="stat"><label>Add a note</label><textarea rows="3" [(ngModel)]="note"
            style="width:100%"></textarea><button pButton label="Add Note" [disabled]="!note.trim()" (click)="save()"
            style="margin-top:.7rem"></button></div>
    <h3>Note history</h3>
    <div class="stat" *ngFor="let n of notes" style="margin-bottom:.7rem">
        <div class="toolbar"><small class="muted">{{n.noteDate|date:'medium'}}</small><button pButton label="Delete"
                severity="danger" size="small" (click)="remove(n)"></button></div>
        <p>{{n.noteDescription}}</p>
    </div>
    <p *ngIf="!notes.length" class="muted">No notes have been added.</p>
</div>
