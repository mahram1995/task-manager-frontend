<div class="login-wrap"><div class="login-card"><h2>Daily Task Management</h2><p class="muted">Sign in to continue</p><form [formGroup]="form" (ngSubmit)="submit()"><div class="field"><label>Username</label><input pInputText formControlName="userName" autocomplete="username"><small *ngIf="form.controls.userName.touched&&form.controls.userName.invalid">Username is required</small></div><div class="field" style="margin-top:1rem"><label>Password</label><input pInputText type="password" formControlName="password" autocomplete="current-password"><small *ngIf="form.controls.password.touched&&form.controls.password.invalid">Password is required</small></div><p *ngIf="error" style="color:#dc2626">{{error}}</p><button pButton type="submit" label="Login" [disabled]="loading" style="width:100%;margin-top:1.2rem"></button></form></div></div>
